# ==============================================================================
# YOLOv8-Pose Dataset Configuration for Vietnamese ID Cards (CCCD & GPLX)
# ==============================================================================
# Target: 4 Physical Corners Detection for Perspective Rectification
# Roboflow Keypoint Specification:
#   Index 0: point_up_left (Top Left)
#   Index 1: point_up_right (Top Right)
#   Index 2: point_bottom_right (Bottom Right)
#   Index 3: point_bottom_left (Bottom Left)
#
# Format: <class-id> <x_center> <y_center> <width> <height> <x0> <y0> <v0> <x1> <y1> <v1> <x2> <y2> <v2> <x3> <y3> <v3>
# Coordinates are normalized to [0.0, 1.0].
# Visibility flag v:
#   0: Not visible / outside frame
#   1: Occluded / extrapolated / rounded corner
#   2: Clearly visible
# ==============================================================================

# Dataset root directory (Relative to project root or absolute path)
path: datasets/document_pose

# Subdirectories for splits (relative to 'path')
train: images/train
val: images/val
test: images/test

# Document Classes (Roboflow compatible)
names:
  0: cccd
  1: gplx

# Keypoint shape definition: [num_keypoints, dimensions]
# 4 corners, 3 dimensions per corner: (x, y, visibility)
kpt_shape: [4, 3]

# Flip indices for horizontal augmentation (left-right reflection):
# Index 0 (point_up_left) <-> Index 1 (point_up_right)
# Index 2 (point_bottom_right) <-> Index 3 (point_bottom_left)
flip_idx: [1, 0, 3, 2]
